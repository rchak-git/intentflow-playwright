testName: Sample_Login_Smoke_Test
description: Smoke test verifying login form population and level 3 escape hatch usage
steps:
  - fieldKey: usernameInput
    intent: populate
    actionType: POPULATE
    value: "testuser@learningmate.com"

  - fieldKey: passwordInput
    intent: populate
    actionType: POPULATE
    value: "SecurePassword123!"

  - fieldKey: loginButton
    intent: action
    actionType: CLICK

  - fieldKey: dualListWidget
    intent: populate
    widgetType: DUAL_LISTBOX
    subAction: ADD
    value:
      - "Role_Admin"
      - "Role_Tester"

  - intent: custom
    actionType: CUSTOM_HANDLER
    handlerName: verifyComplexTableSummary
    params:
      expectedRows: 5
      tableId: "summaryGrid"