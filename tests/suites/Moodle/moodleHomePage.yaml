# yaml-language-server: $schema=../../../.vscode/intent-schema.json
page: moodleHomePage
includes:
  - MoodleLoginSuite

profiles:
  openCourseFromHome:
    refScenario: clickCourseFromHome
    data:
      courseName: "My first course"

sharedScenarios:
  clickCourseFromHome:
    testName: "Log in and navigate to course page via Home page"
    steps:
      # 1. Chain Upstream Login Profile
      - intent: include
        refProfile: validAdminLogin

      # 2. Home Page Actions
      - intent: verify
        fieldKey: moodle_home_homeHeader
        assertion: VISIBLE

      - intent: click
        fieldKey: moodle_home_courseLink
        params:
          text: "${data:courseName}"
