page: "/my/courses.php"
description: "Moodle Course Directory and Course Navigation Suite"
uiMap: "MoodleCourseUiMap"

includes:
  - "moodleLoginSteps.yaml"
  - "moodleHomePageSteps.yaml"

# ---------------------------------------------------------------------------
# SHARED SCENARIOS (Parameterized mechanics referenced by >= 2 profiles)
# ---------------------------------------------------------------------------
sharedScenarios:
  openCourseCard:
    description: "Anchors a course card by title and clicks its title link"
    steps:
      - step: 'Verify course card "${data:courseTitle}" is visible'
        fieldKey: "moodle_course_card"
        intent: "verify"
        params:
          subIntent: "state"
          anchorText: "${data:courseTitle}"
          value: "visible"

      - step: "Click title link on course card"
        fieldKey: "moodle_course_card"
        intent: "action"
        params:
          subIntent: "jsClick"
          anchorText: "${data:courseTitle || 'My first course'}"
          childWidget: "titleLink"

# ---------------------------------------------------------------------------
# PROFILES (Concrete Execution Targets — Prefix: td_*)
# ---------------------------------------------------------------------------
profiles:
  td_openCourseFromCard:
    description: "Verify course card metadata and open course via card title link"
    preconditions:
      - refProfile: "moodleLoginSteps.td_successfulStudentLogin"
      - refProfile: "moodleHomePageSteps.td_navigateToMyCourses"
    steps:
      - step: "Verify course card category text is Miscellaneous"
        fieldKey: "moodle_course_card"
        intent: "verify"
        params:
          subIntent: "contains"
          anchorText: "My first course"
          childWidget: "categoryText"
          value: "Miscellaneous"

      - refScenario: "openCourseCard"
        data:
          courseTitle: "My first course"

      - step: "Verify navigation to Course view page"
        fieldKey: "page"
        intent: "verify"
        params:
          subIntent: "urlContains"
          value: "view.php"

  td_navigateToCourseParticipants:
    description: "Open a course from My Courses card and navigate to Participants tab"
    preconditions:
      - refProfile: "moodleLoginSteps.td_successfulStudentLogin"
      - refProfile: "moodleHomePageSteps.td_navigateToMyCourses"
    steps:
      - refScenario: "openCourseCard"
        data:
          courseTitle: "My first course"

      - step: "Click Participants tab on course navigation bar"
        fieldKey: "moodle_course_participantsTab"
        intent: "action"
        params:
          subIntent: "click"

      - step: "Verify landing on Course Participants page"
        fieldKey: "page"
        intent: "verify"
        params:
          subIntent: "urlContains"
          value: "user"
