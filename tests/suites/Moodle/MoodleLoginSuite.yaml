page: Moodle
description: "Verify successful student login to the Moodle portal"
uiMap: "src/registries/Moodle/moodleLoginUiMap.ts"

sharedScenarios:
  verifyLoginForm:
    description: "Verify the Moodle login form is visible"
    steps:
      - step: "Verify the login form region is visible"
        fieldKey: loginFormRegion
        intent: verify
        assertion: VISIBLE

  studentLogin:
    description: "Log in with student credentials and verify successful authentication"
    refScenario: verifyLoginForm
    additionalSteps:
      - step: "Populate the username field"
        fieldKey: usernameInput
        intent: populate
        value: "${data:usernameInput}"

      - step: "Populate the password field"
        fieldKey: passwordInput
        intent: populate
        value: "${data:passwordInput}"

      - step: "Click the Log in button"
        fieldKey: loginButton
        intent: click

      - step: "Verify no error alert is visible"
        fieldKey: errorAlert
        intent: verify
        assertion: NOT_VISIBLE

      - step: "Verify the login form is no longer visible after authentication"
        fieldKey: loginFormRegion
        intent: verify
        assertion: NOT_VISIBLE

      - step: "Verify the authenticated page contains the student welcome text"
        fieldKey: PAGE
        intent: verify
        assertion: CONTAIN_TEXT
        value: "Moodle 5.3 sandbox demo"

profiles:
  validStudentLogin:
    usesScenario: studentLogin
    data:
      usernameInput: "student"
      passwordInput: "sandbox24"
