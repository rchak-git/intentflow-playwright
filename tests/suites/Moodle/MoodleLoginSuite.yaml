page: moodleLoginPage
uiMap:
  - moodleLoginUiMap

profiles:
  validAdminLogin:
    refScenario: adminLogin
    data:
      usernameInput: "admin"
      passwordInput: "sandbox24"

sharedScenarios:
  adminLogin:
    testName: "Log in with Admin credentials"
    steps:
      # 1. Navigate to Moodle Login Page first!
      - intent: navigate
        value: "https://sandbox.moodledemo.net/login/index.php"

      - intent: populate
        fieldKey: usernameInput
        value: "${data:usernameInput}"

      - intent: populate
        fieldKey: passwordInput
        value: "${data:passwordInput}"

      - intent: click
        fieldKey: loginButton

      - intent: verify
        fieldKey: errorAlert
        assertion: NOT_VISIBLE
