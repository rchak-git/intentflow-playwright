page: moodleLoginPage

profiles:
  validAdminLogin:
    refScenario: adminLogin
    data:
      usernameInput: "admin"
      passwordInput: "sandbox24"

sharedScenarios:
  adminLogin:
    testName: "Log in with Admin credentials"
    steps:
      - intent: navigate
        value: "https://sandbox.moodledemo.net/login/index.php"

      - intent: populate
        fieldKey: moodle_login_usernameInput
        value: "${data:usernameInput}"

      - intent: populate
        fieldKey: moodle_login_passwordInput
        value: "${data:passwordInput}"

      - intent: click
        fieldKey: moodle_login_loginButton
