description: "MHE Home Directory course search and course card launch workflows"
uiMap: "MheHomePageUiMap"
includes:
  - "mhe_LoginSteps.yaml"

sharedScenarios:
  executeSearchAndOpenCourseCard:
    description: "Searches for a course on the MHE Home Directory and opens its Course Dashboard in a new tab"
    steps:
      - step: "Wait for initial course grid to finish loading on the Home Directory"
        fieldKey: "mhe_hm_courseCard"
        intent: "verify"
        params:
          subIntent: "state"
          value: "visible"

      - step: "Search for the course on the MHE Home Directory"
        fieldKey: "mhe_hm_searchInput"
        intent: "populate"
        params:
          value: "${data:courseName}"

      - step: "Wait for the search results to filter down to the matching course card"
        fieldKey: "mhe_hm_courseCard"
        intent: "verify"
        params:
          subIntent: "count"
          value: 1

      - step: "Open the searched course card"
        fieldKey: "mhe_hm_courseCard"
        intent: "action"
        params:
          subIntent: "clickSubControl"
          anchorText: "${data:courseName}"
          childWidget: "imageLink"

      - step: "Switch focus to the newly opened Course Dashboard tab"
        fieldKey: "page"
        intent: "custom"
        params:
          handler: "switchTab"
          value: "new"

profiles:
  td_searchAndOpenCourseDashboard:
    description: "Logs in as Admin, searches for Project Assignment flow, and opens the Course Dashboard tab"
    preconditions:
      - refProfile: "mhe_LoginSteps.td_successfulAdminLogin"
    steps:
      - refScenario: "executeSearchAndOpenCourseCard"
        data:
          courseName: "${data:courseName || 'Project Assignment flow'}"
