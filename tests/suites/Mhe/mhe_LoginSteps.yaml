page: "/delivery-player/#/login"
description: "MHE Delivery Player Login Suite"
uiMap: "MheLoginUiMap"

profiles:
  td_successfulAdminLogin:
    description: "Successfully log into MHE Delivery Player with valid credentials"
    steps:
      - step: "Navigate to MHE Login page"
        fieldKey: "page"
        intent: "action"
        params:
          subIntent: "navigate"
          value: "/delivery-player/#/login"
      - step: "Enter username"
        fieldKey: "mhe_login_usernameTextbox"
        intent: "populate"
        params:
          value: "${data:username || 'admin_one'}"
      - step: "Enter password"
        fieldKey: "mhe_login_passwordTextbox"
        intent: "populate"
        params:
          value: "${data:password || 'P@ssw0rd'}"
      - step: "Click login button"
        fieldKey: "mhe_login_loginButton"
        intent: "action"
        params:
          subIntent: "click"
      - step: "Verify URL contains home path"
        fieldKey: "page"
        intent: "verify"
        params:
          subIntent: "urlContains"
          value: "${data:expectedUrlSubstring || '/delivery-player/#/login'}"
