page: "/login/index.php"
description: "Pilot Moodle login scenarios"
uiMap: "pilotMoodleLoginUiMap"

# Credentials are supplied by the spec through environment variables at runtime.
sharedScenarios:
  executePilotMoodleLogin:
    description: "Open the login page and submit supplied credentials"
    steps:
      - step: "Navigate to the login page"
        fieldKey: "page"
        intent: "action"
        params:
          subIntent: "navigate"
          value: "/login/index.php"
      - step: "Enter the username"
        fieldKey: "pilot_moodle_login_usernameTextbox"
        intent: "populate"
        params:
          value: "${data:username}"
      - step: "Enter the password"
        fieldKey: "pilot_moodle_login_passwordTextbox"
        intent: "populate"
        params:
          value: "${data:password}"
      - step: "Click Log in"
        fieldKey: "pilot_moodle_login_submitButton"
        intent: "action"
        params:
          subIntent: "click"

profiles:
  td_pilotSuccessfulAdminLogin:
    description: "Valid admin login and home page verification"
    steps:
      - refScenario: "executePilotMoodleLogin"
      - step: "Verify the URL contains moodledemo"
        fieldKey: "page"
        intent: "verify"
        params:
          subIntent: "urlContains"
          value: "moodledemo"
      - step: "Verify the page heading is visible"
        fieldKey: "pilot_moodle_home_headingLabel"
        intent: "verify"
        params:
          subIntent: "state"
          value: "visible"
      - step: "Verify the page heading text"
        fieldKey: "pilot_moodle_home_headingLabel"
        intent: "verify"
        params:
          subIntent: "equals"
          value: "Moodle 5.3 sandbox demo"

  td_pilotSuccessfulStudentLogin:
    description: "Verify successful student login and the home page heading"
    steps:
      - refScenario: "executePilotMoodleLogin"
      - step: "Verify the URL contains moodledemo"
        fieldKey: "page"
        intent: "verify"
        params:
          subIntent: "urlContains"
          value: "moodledemo"
      - step: "Verify the page heading is visible"
        fieldKey: "pilot_moodle_home_headingLabel"
        intent: "verify"
        params:
          subIntent: "state"
          value: "visible"
      - step: "Verify the page heading text"
        fieldKey: "pilot_moodle_home_headingLabel"
        intent: "verify"
        params:
          subIntent: "equals"
          value: "Moodle 5.3 sandbox demo"

  td_pilotInvalidPasswordLogin:
    description: "Verify invalid login displays the error and remains on the login page"
    steps:
      - refScenario: "executePilotMoodleLogin"
      - step: "Verify the error notification is visible"
        fieldKey: "pilot_moodle_login_errorLabel"
        intent: "verify"
        params:
          subIntent: "state"
          value: "visible"
      - step: "Verify the error notification text"
        fieldKey: "pilot_moodle_login_errorLabel"
        intent: "verify"
        params:
          subIntent: "contains"
          value: "Your login info may be incorrect. Please try again."
      - step: "Verify the user remains on the login page"
        fieldKey: "page"
        intent: "verify"
        params:
          subIntent: "urlContains"
          value: "/login/index[.]php"
